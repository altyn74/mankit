<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mankit - eWeLink</title>
</head>
<body>
    <h2>Mankit</h2>
    <p>Подключение eWeLink...</p>

    <script>
        const params = new URLSearchParams(window.location.search);

        const code = params.get("code");
        const region = params.get("region");
        const state = params.get("state");
        const error = params.get("error");

        if (error) {
            document.body.innerHTML =
                "<h2>Ошибка eWeLink</h2><p>" + error + "</p>";
        } else if (code) {
            const worker =
                "https://mankit-ewelink.miningshopx11.workers.dev/callback";

            const target = new URL(worker);
            target.searchParams.set("code", code);

            if (region) target.searchParams.set("region", region);
            if (state) target.searchParams.set("state", state);

            window.location.replace(target.toString());
        } else {
            document.body.innerHTML =
                "<h2>Код авторизации не получен</h2>";
        }
    </script>
</body>
</html>
